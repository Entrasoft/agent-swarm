[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-swarm-lab"
version = "0.2.0"
description = "Inspectable experiments in verified multi-agent problem solving"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
swarm-lab = "swarm_lab.cli:main"

[tool.setuptools.packages.find]
include = ["swarm_lab*"]
